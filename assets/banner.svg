<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#120a21"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Title -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff">
        <animate attributeName="stop-color" values="#00f3ff;#bc13fe;#38bdf8;#00f3ff" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9;#00f3ff;#bc13fe;#e879f9" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#bc13fe">
        <animate attributeName="stop-color" values="#bc13fe;#38bdf8;#00f3ff;#bc13fe" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Border Beam Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#bc13fe"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>

    <!-- Subtle Scanline / Grid -->
    <pattern id="gridLines" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="bracketGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatGraphic {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1deg);
      }
    }

    @keyframes pulseGlowLeft {
      0%, 100% {
        opacity: 0.18;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(1.08);
      }
    }

    @keyframes pulseGlowRight {
      0%, 100% {
        opacity: 0.22;
        transform: scale(1);
      }
      50% {
        opacity: 0.42;
        transform: scale(1.1);
      }
    }

    @keyframes beamSweep {
      0% {
        stroke-dashoffset: 3100;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes particleTwinkle1 {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.9; transform: translateY(-4px); }
    }

    @keyframes particleTwinkle2 {
      0%, 100% { opacity: 0.8; transform: translateY(0); }
      50% { opacity: 0.15; transform: translateY(4px); }
    }

    @keyframes badgePulse {
      0%, 100% { border-color: rgba(255,255,255,0.1); }
      50% { border-color: rgba(0,243,255,0.4); }
    }

    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    .animated-bracket {
      animation: floatGraphic 6s ease-in-out infinite;
      transform-origin: center;
    }

    .glow-cyan-orb {
      animation: pulseGlowLeft 7s ease-in-out infinite;
      transform-origin: 15% 35%;
    }

    .glow-purple-orb {
      animation: pulseGlowRight 8s ease-in-out infinite;
      transform-origin: 85% 65%;
    }

    .border-glow-path {
      stroke-dasharray: 400, 2700;
      animation: beamSweep 7s linear infinite;
    }

    .blinking-caret {
      animation: cursorBlink 1.1s infinite;
    }

    .star-1 { animation: particleTwinkle1 3s ease-in-out infinite; }
    .star-2 { animation: particleTwinkle2 4s ease-in-out infinite; }
    .star-3 { animation: particleTwinkle1 5s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="1196" height="346" rx="22" fill="url(#bgGradient)" />
  <rect x="2" y="2" width="1196" height="346" rx="22" fill="url(#dotPattern)" />
  <rect x="2" y="2" width="1196" height="346" rx="22" fill="url(#gridLines)" />

  <!-- Animated Ambient Aura Orbs -->
  <g class="glow-cyan-orb">
    <circle cx="180" cy="120" r="170" fill="#00f3ff" opacity="0.25" filter="url(#neonCyanGlow)" />
  </g>
  <g class="glow-purple-orb">
    <circle cx="1020" cy="220" r="190" fill="#bc13fe" opacity="0.28" filter="url(#neonPurpleGlow)" />
  </g>

  <!-- Static Base Border -->
  <rect x="2" y="2" width="1196" height="346" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Animated High-Tech Glowing Border Beam -->
  <rect x="2" y="2" width="1196" height="346" rx="22" fill="none" stroke="url(#borderGradient)" stroke-width="2.5" class="border-glow-path" />

  <!-- Top Glass Terminal Header Bar -->
  <g transform="translate(36, 28)">
    <!-- Traffic lights -->
    <circle cx="8" cy="8" r="5.5" fill="#ff5f56" opacity="0.9"/>
    <circle cx="26" cy="8" r="5.5" fill="#ffbd2e" opacity="0.9"/>
    <circle cx="44" cy="8" r="5.5" fill="#27c93f" opacity="0.9"/>

    <!-- Terminal Breadcrumb / Shell Badge -->
    <rect x="70" y="-3" width="310" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Pulsing Live Radar Indicator -->
    <circle cx="86" cy="9" r="3.5" fill="#00f3ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <text x="98" y="13" fill="#94a3b8" class="font-mono" font-size="11" font-weight="600">
      ahmed@dev-workspace: <tspan fill="#00f3ff">~/frontend</tspan>
    </text>
    <rect x="290" y="3" width="7" height="12" fill="#00f3ff" class="blinking-caret" />

    <!-- Right Side Status Badge -->
    <g transform="translate(1000, 0)">
      <circle cx="0" cy="9" r="4" fill="#10b981">
        <animate attributeName="r" values="3.5;5;3.5" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="13" fill="#10b981" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">AVAILABLE FOR WORK</text>
    </g>
  </g>

  <!-- Star / Particle Floating Sparkles -->
  <circle cx="750" cy="80" r="1.5" fill="#00f3ff" class="star-1" />
  <circle cx="830" cy="140" r="2" fill="#bc13fe" class="star-2" />
  <circle cx="680" cy="220" r="1.5" fill="#38bdf8" class="star-3" />
  <circle cx="950" cy="290" r="2" fill="#e879f9" class="star-1" />
  <circle cx="550" cy="110" r="1.2" fill="#ffffff" class="star-2" />

  <!-- Right Side Interactive 3D Cyber Core Graphic (Animated Float) -->
  <g class="animated-bracket" transform="translate(860, 85)">
    <!-- Ambient Neon Ring -->
    <circle cx="140" cy="100" r="95" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 140 100" to="360 140 100" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="140" cy="100" r="115" fill="none" stroke="#bc13fe" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="14 10">
      <animateTransform attributeName="transform" type="rotate" from="360 140 100" to="0 140 100" dur="45s" repeatCount="indefinite"/>
    </circle>

    <!-- Glass Backdrop Shield -->
    <rect x="40" y="10" width="200" height="180" rx="24" fill="#0b1120" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

    <!-- Glowing Tech Code Brackets < / > -->
    <g filter="url(#bracketGlow)">
      <!-- Left Bracket < -->
      <path d="M 98 60 L 58 100 L 98 140" fill="none" stroke="#00f3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Forward Slash / -->
      <line x1="154" y1="52" x2="126" y2="148" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Right Bracket > -->
      <path d="M 182 60 L 222 100 L 182 140" fill="none" stroke="#bc13fe" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Orbiting Energy Dots -->
    <circle cx="140" cy="10" r="3" fill="#00f3ff" filter="url(#neonCyanGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 140 100" to="360 140 100" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="190" r="3" fill="#bc13fe" filter="url(#neonPurpleGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 140 100" to="360 140 100" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Left Content Block -->
  <g transform="translate(54, 98)">
    <!-- Role Kicker with Glowing Dot -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="235" height="28" rx="14" fill="#00f3ff" fill-opacity="0.08" stroke="#00f3ff" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#00f3ff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#00f3ff" class="font-mono" font-size="11.5" font-weight="700" letter-spacing="1.8">SENIOR FRONTEND DEV</text>
    </g>

    <!-- Main Name Title with Shimmer Glow -->
    <text x="0" y="78" fill="url(#shimmerGradient)" class="font-sans" font-size="46" font-weight="900" letter-spacing="-0.03em">
      Ahmed Abdel-Salam
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="116" fill="#94a3b8" class="font-sans" font-size="18.5" font-weight="400">
      Engineering high-performance, responsive &amp; resilient web applications with <tspan fill="#ffffff" font-weight="600">Next.js</tspan> &amp; <tspan fill="#ffffff" font-weight="600">TypeScript</tspan>.
    </text>

    <!-- Tech Arsenal Badge Pills Row -->
    <g transform="translate(0, 150)">
      <!-- Next.js App Router -->
      <g>
        <rect x="0" y="0" width="168" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <circle cx="18" cy="18" r="4.5" fill="#00f3ff"/>
        <text x="32" y="23" fill="#ffffff" class="font-sans" font-size="13.5" font-weight="600">Next.js App Router</text>
      </g>

      <!-- TypeScript -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="128" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <circle cx="18" cy="18" r="4.5" fill="#3178c6"/>
        <text x="32" y="23" fill="#ffffff" class="font-sans" font-size="13.5" font-weight="600">TypeScript</text>
      </g>

      <!-- Tailwind CSS -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="140" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <circle cx="18" cy="18" r="4.5" fill="#38bdf8"/>
        <text x="32" y="23" fill="#ffffff" class="font-sans" font-size="13.5" font-weight="600">Tailwind CSS</text>
      </g>

      <!-- Framer Motion -->
      <g transform="translate(472, 0)">
        <rect x="0" y="0" width="148" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <circle cx="18" cy="18" r="4.5" fill="#bc13fe"/>
        <text x="32" y="23" fill="#ffffff" class="font-sans" font-size="13.5" font-weight="600">Framer Motion</text>
      </g>

      <!-- State & Forms -->
      <g transform="translate(632, 0)">
        <rect x="0" y="0" width="142" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
        <circle cx="18" cy="18" r="4.5" fill="#10b981"/>
        <text x="32" y="23" fill="#ffffff" class="font-sans" font-size="13.5" font-weight="600">State &amp; Forms</text>
      </g>
    </g>
  </g>
</svg>
